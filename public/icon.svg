<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AI 评论助手 图标源文件（定稿于 Pencil 画布，2026-10-20）
       概念：对话卡片（评论）+ 对勾（达标检测）
       主色取自界面 --accent: #2563EB
       修改后运行 node .probe/make-icon.js 重新生成 public/icon.ico
       小尺寸（16/24px）由该脚本自动加粗对勾并去掉投影，见脚本内注释。 -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1A3FBF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0A2A7A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="256" height="256" rx="58" ry="58" fill="url(#bg)"/>

  <!-- 对话卡片 -->
  <rect x="44" y="54" width="168" height="124" rx="38" ry="38"
        fill="url(#card)" filter="url(#shadow)"/>

  <!-- 对勾 -->
  <path d="M94 116 L119 141 L163 93" fill="none" stroke="#2563EB" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
