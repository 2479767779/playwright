<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AI 评论助手 图标源文件
       概念：对话框（评论）+ 对勾（达标检测）
       主色取自界面 --accent: #2563EB
       修改后运行 node .probe/make-icon.js 重新生成 public/icon.ico -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1A3FBF"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角矩形 -->
  <rect x="6" y="6" width="244" height="244" rx="60" ry="60" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <path d="M66 6 H190 A60 60 0 0 1 250 66 V104 H6 V66 A60 60 0 0 1 66 6 Z" fill="url(#sheen)"/>

  <!-- 对话框（尾巴在左下方，直角尾巴，缩小后不易糊） -->
  <path d="M80 58 H176 A32 32 0 0 1 208 90 V146 A32 32 0 0 1 176 178 H112 L80 202 V178 A32 32 0 0 1 48 146 V90 A32 32 0 0 1 80 58 Z"
        fill="url(#bubble)"/>

  <!-- 对勾 -->
  <path d="M97 119 L121 143 L161 93" fill="none" stroke="#2563EB" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
