<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AI 评论助手 图标源文件（定稿于 Pencil 画布，2026-10-20 用户设计版）
       概念：对话气泡（评论）+ 大对勾（达标检测）
       主色取自界面 --accent: #2563EB
       修改后运行 node .probe/make-icon.js 重新生成 public/icon.ico
       小尺寸（16/24px）由该脚本自动加粗对勾并去掉投影。 -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5EA1FF"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#173DBF"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0A2A7A" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="256" height="256" rx="58" ry="58" fill="url(#bg)"/>

  <!-- 对话气泡（含左下小尾巴）+ 对勾：合成一组，便于小尺寸整体放大 -->
  <g id="mark">
    <path d="M82 56h92c19 0 34 15 34 34v50c0 19-15 34-34 34h-60c-16 0-29 9-39 23-3 4-9 3-9-3 0-10 0-20-8-28-6-6-10-15-10-26v-50c0-19 15-34 34-34z"
          fill="url(#bubble)" filter="url(#shadow)"/>

    <path d="M97 119l24 24 40-50" fill="none" stroke="#2563EB" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
